let currentMonth = 4; // 0-indexed, so 4 = May
let selectedDate = '2026-05-15';

const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function formatKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function formatDateRu(y, m, d) {
  return `${String(d).padStart(2,'0')}.${String(m+1).padStart(2,'0')}.${y}`;
}

// ===== RENDER DESKTOP CALENDAR =====
function renderDesktopCalendar() {
  document.getElementById('desktopMonthTitle').textContent = `${monthNames[currentMonth]} ${currentYear}`;

  const container = document.getElementById('desktopCalendarDays');
  container.innerHTML = '';

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

  const today = new Date();
  const todayKey = formatKey(today.getFullYear(), today.getMonth(), today.getDate());

  // Prev month trailing days
  for (let i = startOffset - 1; i >= 0; i--) {
    const d = daysInPrevMonth - i;
    const cell = createDesktopCell(d, true, false, null);
    container.appendChild(cell);
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const key = formatKey(currentYear, currentMonth, d);
    const isToday = key === todayKey;
    const isSelected = key === selectedDate;
    const cell = createDesktopCell(d, false, isToday, key, isSelected);
    container.appendChild(cell);
  }

  // Next month fill
  const total = container.children.length;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= remaining; d++) {
    const cell = createDesktopCell(d, true, false, null);
    container.appendChild(cell);
  }
}

function createDesktopCell(day, isOther, isToday, key, isSelected) {
  const cell = document.createElement('div');
  cell.className = 'calendar-cell' + (isOther ? ' other-month' : '') + (isToday ? ' today' : '') + (isSelected ? ' selected' : '');

  const num = document.createElement('div');
  num.className = 'cell-number';
  num.textContent = day;
  cell.appendChild(num);

  if (key && events[key]) {
    events[key].slice(0, 2).forEach(ev => {
      const chip = document.createElement('span');
      chip.className = `event-chip ${ev.color}`;
      chip.textContent = `${ev.name} ${ev.start}`;
      chip.onclick = (e) => {
        e.stopPropagation();
        openDesktopEditor(ev, key);
      };
      cell.appendChild(chip);
    });
  }

  if (!isOther && key) {
    cell.onclick = () => {
      selectedDate = key;
      renderDesktopCalendar();
    };
  }

  return cell;
}

// ===== RENDER MOBILE CALENDAR =====
function renderMobileCalendar() {
  document.getElementById('mobileMonthBtn').innerHTML = `${monthNames[currentMonth]} ${currentYear} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;

  const container = document.getElementById('mobileCalendarDays');
  container.innerHTML = '';

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

  const today = new Date();
  const todayKey = formatKey(today.getFullYear(), today.getMonth(), today.getDate());

  for (let i = startOffset - 1; i >= 0; i--) {
    const d = daysInPrevMonth - i;
    container.appendChild(createMobileCell(d, true, false, null));
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key = formatKey(currentYear, currentMonth, d);
    const isToday = key === todayKey;
    container.appendChild(createMobileCell(d, false, isToday, key));
  }

  const total = container.children.length;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= remaining; d++) {
    container.appendChild(createMobileCell(d, true, false, null));
  }
}

function createMobileCell(day, isOther, isToday, key) {
  const cell = document.createElement('div');
  const dotColors = ['has-event-blue','has-event-cyan','has-event-green'];
  let dotClass = '';
  if (key && events[key]) {
    const idx = Object.keys(events).indexOf(key) % dotColors.length;
    dotClass = ' has-event ' + dotColors[idx];
  }
  cell.className = 'mobile-cell' + (isOther ? ' other-month' : '') + (isToday ? ' today' : '') + dotClass;

  const num = document.createElement('div');
  num.className = 'mobile-cell-num';
  num.textContent = day;
  cell.appendChild(num);

  if (!isOther && key) {
    cell.onclick = () => selectMobileDate(key, day);
  }

  return cell;
}

function selectMobileDate(key, day) {
  selectedDate = key;
  const parts = key.split('-');
  document.getElementById('mobileEventsTitle').textContent = `События на ${day} ${monthNames[currentMonth].toLowerCase().slice(0,3)}`;
  
  const list = document.getElementById('mobileEventsList');
  list.innerHTML = '';
  
  const dotMap = { purple:'blue', blue:'cyan', green:'green', yellow:'blue' };
  
  if (events[key]) {
    events[key].forEach(ev => {
      const item = document.createElement('div');
      item.className = 'mobile-event-item';
      const dotColor = dotMap[ev.color] || 'blue';
      item.innerHTML = `
        <div class="mobile-event-dot ${dotColor}"></div>
        <div class="mobile-event-info">
          <div class="name">${ev.name}</div>
          <div class="time">${ev.start} — ${ev.end}</div>
        </div>`;
      item.onclick = () => openMobileEditor(ev.name, formatDateRu(...key.split('-').map(Number).map((v,i)=>i===1?v-1:v)), ev.start, ev.end, ev.desc || '');
      list.appendChild(item);
    });
  } else {
    list.innerHTML = '<div style="color:#9CA3AF;font-size:14px;padding:12px 0;">Нет событий</div>';
  }
}

// ===== NAVIGATION =====
function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderDesktopCalendar();
  renderMobileCalendar();
}

function goToToday() {
  const today = new Date();
  currentYear = today.getFullYear();
  currentMonth = today.getMonth();
  selectedDate = formatKey(currentYear, currentMonth, today.getDate());
  renderDesktopCalendar();
  renderMobileCalendar();
}

// ===== DESKTOP EDITOR =====
function openDesktopEditor(ev, key) {
  document.getElementById('desktopCalendar').style.display = 'none';
  document.getElementById('desktopEditor').style.display = 'flex';

  const parts = key.split('-');
  document.getElementById('desktopEventName').value = ev.name;
  document.getElementById('desktopEventDate').value = `${parts[2]}.${parts[1]}.${parts[0]}`;
  document.getElementById('desktopEventStart').value = ev.start;
  document.getElementById('desktopEventEnd').value = ev.end;
  document.getElementById('desktopEventDesc').value = ev.desc || '';
}

function openNewEventDesktop() {
  document.getElementById('desktopCalendar').style.display = 'none';
  document.getElementById('desktopEditor').style.display = 'flex';
  document.getElementById('desktopEventName').value = '';
  document.getElementById('desktopEventDate').value = '';
  document.getElementById('desktopEventStart').value = '';
  document.getElementById('desktopEventEnd').value = '';
  document.getElementById('desktopEventDesc').value = '';
}

function closeDesktopEditor() {
  document.getElementById('desktopCalendar').style.display = 'flex';
  document.getElementById('desktopEditor').style.display = 'none';
}

function saveEvent() {
  closeDesktopEditor();
}

// ===== MOBILE EDITOR =====
function openMobileEditor(name, date, start, end, desc) {
  document.getElementById('mobileCalendarPage').style.display = 'none';
  const editor = document.getElementById('mobileEditorPage');
  editor.style.display = 'flex';
  editor.style.flexDirection = 'column';

  document.getElementById('mobileEventName').value = name;
  document.getElementById('mobileEventDate').value = date;
  document.getElementById('mobileEventStart').value = start;
  document.getElementById('mobileEventEnd').value = end;
  document.getElementById('mobileEventDesc').value = desc;
}

function closeMobileEditor() {
  document.getElementById('mobileEditorPage').style.display = 'none';
  document.getElementById('mobileCalendarPage').style.display = 'flex';
}

// ===== INIT =====
renderDesktopCalendar();
renderMobileCalendar();
</script>

</body>
</html>
