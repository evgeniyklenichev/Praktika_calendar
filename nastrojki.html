        <span class="mobile-title">Настройки</span>
        <div style="width:36px;"></div>

      <!-- Desktop header -->
      <div class="page-header" style="margin-bottom:28px;">
        <h1 class="page-title">Настройки</h1>
      </div>

      <!-- Settings content wrapper (mobile padding) -->
      <div class="settings-wrapper">

        <!-- General -->
        <div class="settings-section">
          <div class="settings-section-title">Общие</div>
          <div class="divider"></div>

          <div class="settings-row">
            <label class="settings-label">Первый день недели</label>
            <select class="settings-select">
              <option>Понедельник</option>
              <option>Воскресенье</option>
              <option>Суббота</option>
            </select>
          </div>

          <div class="settings-row">
            <label class="settings-label">Часовой пояс</label>
            <select class="settings-select">
              <option>(UTC+03:00) Москва</option>
              <option>(UTC+00:00) UTC</option>
              <option>(UTC+01:00) Берлин</option>
              <option>(UTC+02:00) Хельсинки</option>
              <option>(UTC+05:00) Екатеринбург</option>
              <option>(UTC+08:00) Пекин</option>
            </select>
          </div>

          <div class="settings-row">
            <label class="settings-label">Формат времени</label>
            <select class="settings-select">
              <option>24-часовой</option>
              <option>12-часовой (AM/PM)</option>
            </select>
          </div>
        </div>

        <!-- Notifications -->
        <div class="settings-section">
          <div class="settings-section-title">Уведомления</div>
          <div class="divider"></div>

          <div class="settings-row">
            <label class="settings-label">Уведомления о событиях</label>
            <select class="settings-select">
              <option>За 30 минут до начала</option>
              <option>За 15 минут до начала</option>
              <option>За 1 час до начала</option>
              <option>За 1 день до начала</option>
              <option>Выключены</option>
            </select>
          </div>

          <div class="settings-row">
            <label class="settings-label">Уведомления о напоминаниях</label>
            <select class="settings-select">
              <option>В момент времени</option>
              <option>За 5 минут</option>
              <option>За 15 минут</option>
              <option>Выключены</option>
            </select>
          </div>
        </div>

        <!-- Appearance -->
        <div class="settings-section">
          <div class="settings-section-title">Внешний вид</div>
          <div class="divider"></div>

          <div class="settings-row" style="flex-direction: column; align-items: flex-start; gap: 14px; border:none;">
            <label class="settings-label">Тема</label>
            <div class="theme-switcher">
              <button class="theme-btn active" id="btn-light" onclick="setTheme('light')">Светлая</button>
              <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')">Тёмная</button>
              <button class="theme-btn" id="btn-system" onclick="setTheme('system')">Системная</button>
            </div>
          </div>
        </div>

  <script>
    function getSystemTheme() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyTheme(theme) {
      const resolved = theme === 'system' ? getSystemTheme() : theme;
      document.documentElement.setAttribute('data-theme', resolved);
      // Propagate to all pages via localStorage
      localStorage.setItem('theme', theme);
      localStorage.setItem('resolvedTheme', resolved);
    }

    function setTheme(theme) {
      applyTheme(theme);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + theme).classList.add('active');
    }

    // Init
    const saved = localStorage.getItem('theme') || 'light';
    applyTheme(saved);
    const btn = document.getElementById('btn-' + saved);
    if (btn) btn.classList.add('active');
    document.querySelectorAll('.theme-btn').forEach(b => {
      if (b !== btn) b.classList.remove('active');
    });

    // Listen for system changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (localStorage.getItem('theme') === 'system') applyTheme('system');
    });
  </script>

  <style>
    /* Additional padding for settings content on mobile */
    @media (max-width: 680px) {
      .settings-wrapper {
        padding: 20px;
      }
    }
  </style>
